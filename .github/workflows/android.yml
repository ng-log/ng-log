name: Android

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: NDK-C++${{matrix.std}}-${{matrix.abi}}-${{matrix.build_type}}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ !matrix.codeql && 'ccache' || '' }}
      NDK_VERSION: 29.0.14206865
    strategy:
      fail-fast: true
      matrix:
        std: [14, 17, 20, 23]
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
        build_type: [Debug, Release]
        # CodeQL traces the compiler and misses translation units served from
        # the compiler cache. Analyze a single configuration without the cache.
        include:
          - std: 20
            abi: arm64-v8a
            build_type: Release
            codeql: true

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: matrix.codeql
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            cmake \
            ninja-build

      - name: Setup Compiler Cache
        if: ${{ !matrix.codeql }}
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android-C++${{matrix.std}}-${{matrix.abi}}-${{matrix.build_type}}
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      - name: Setup NDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo 'y' | ${{env.ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;${{env.NDK_VERSION}}'

      - name: Configure
        env:
          CXXFLAGS: -Wall -Wextra -Wpedantic -Wsign-conversion -Wtautological-compare -Wformat-nonliteral -Wundef -Werror ${{env.CXXFLAGS}}
        run: |
          cmake -S . -B build_${{matrix.abi}} \
                -DCMAKE_ANDROID_API=28 \
                -DCMAKE_ANDROID_ARCH_ABI=${{matrix.abi}} \
                -DCMAKE_ANDROID_NDK=/usr/local/lib/android/sdk/ndk/${{env.NDK_VERSION}} \
                -DCMAKE_ANDROID_STL_TYPE=c++_shared \
                -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                -DCMAKE_CXX_STANDARD=${{matrix.std}} \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_SYSTEM_NAME=Android \
                -G Ninja \
                -Werror=author

      - name: Build
        run: |
          cmake --build build_${{matrix.abi}} \
                --config ${{matrix.build_type}}

      - name: Perform CodeQL Analysis
        if: matrix.codeql
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:cpp/android
