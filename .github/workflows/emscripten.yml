name: Emscripten

on: workflow_call

jobs:
  build-linux:
    defaults:
      run:
        shell: bash
    name: Emscripten-C++${{matrix.std}}-${{matrix.build_type}}-${{matrix.lib}}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        build_type: [Release, Debug]
        lib: [static]
        std: [14, 17, 20, 23]
        # CodeQL traces the compiler and misses translation units served from
        # the compiler cache. Analyze a single configuration without the cache.
        include:
          - build_type: Release
            lib: static
            std: 20
            codeql: true

    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ !matrix.codeql && 'ccache' || '' }}
      # Tests require threads and exceptions which Emscripten disables by default.
      EMSCRIPTEN_FLAGS: -pthread -fexceptions

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: google/googletest
          ref: v1.17.0
          path: googletest

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            cmake \
            gpg \
            ninja-build

      # The SDK lives outside the workspace to keep its headers out of the
      # coverage report.
      - name: Resolve Emscripten Version
        id: emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          echo "version=$(jq -r .aliases.latest "$RUNNER_TEMP/emsdk/emscripten-releases-tags.json")" >> "$GITHUB_OUTPUT"

      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: |
            ${{runner.temp}}/emsdk/node
            ${{runner.temp}}/emsdk/upstream
          key: emsdk-${{steps.emsdk.outputs.version}}-${{runner.os}}-${{runner.arch}}

      - name: Setup Emscripten
        working-directory: ${{runner.temp}}/emsdk
        run: |
          ./emsdk install "${{steps.emsdk.outputs.version}}"
          ./emsdk activate "${{steps.emsdk.outputs.version}}"
          echo "EMSDK=$PWD" >> "$GITHUB_ENV"
          echo "$PWD/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Setup Compiler Cache
        if: ${{ !matrix.codeql }}
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: emscripten-C++${{matrix.std}}-${{matrix.build_type}}-${{matrix.lib}}
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      - uses: actions/setup-python@v7
        if: matrix.build_type == 'Debug'
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/coverage/requirements.txt

      - name: Setup Coverage Dependencies
        if: matrix.build_type == 'Debug'
        run: |
          pip install -r .github/coverage/requirements.txt

      - name: Setup Environment
        if: matrix.build_type == 'Debug'
        run: |
          echo 'CXXFLAGS=--coverage -fprofile-update=atomic' >> $GITHUB_ENV
          echo 'LDFLAGS=--coverage' >> $GITHUB_ENV

      # GoogleTest is built with GTEST_HAS_PTHREAD=1 which its headers do not
      # detect under Emscripten. Tests must define it as well.
      - name: Build GoogleTest
        env:
          CXXFLAGS: ${{env.EMSCRIPTEN_FLAGS}}
          LDFLAGS: ${{env.EMSCRIPTEN_FLAGS}}
        run: |
          emcmake cmake -S googletest -B build_googletest \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/googletest" \
            -G Ninja
          cmake --build build_googletest --target install

      - name: Initialize CodeQL
        if: matrix.codeql
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      # Tests need the exit code, coverage data, host file system and
      # environment in Node. The flags are per configuration because
      # EXIT_RUNTIME breaks the CMake configuration checks.
      - name: Configure
        env:
          CXXFLAGS: -DGTEST_HAS_PTHREAD=1 ${{env.EMSCRIPTEN_FLAGS}} -Wall -Wextra -Wsign-conversion -Wtautological-compare -Wformat-nonliteral -Wundef -Werror -Wno-error=wasm-exception-spec ${{env.CXXFLAGS}}
          LDFLAGS: ${{env.EMSCRIPTEN_FLAGS}} ${{env.LDFLAGS}}
        run: |
          BUILD_TYPE=${{matrix.build_type}}
          emcmake cmake -S . -B build_${{matrix.build_type}} \
            -DBUILD_SHARED_LIBS=${{matrix.lib == 'shared'}} \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
            -DCMAKE_CXX_STANDARD=${{matrix.std}} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            "-DCMAKE_EXE_LINKER_FLAGS_${BUILD_TYPE^^}=-sEXIT_RUNTIME -sNODERAWFS -sPROXY_TO_PTHREAD" \
            -DCMAKE_FIND_ROOT_PATH="$RUNNER_TEMP/googletest" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -G Ninja \
            -Werror=author

      - name: Build
        run: |
          cmake --build build_${{matrix.build_type}} \
                --config ${{matrix.build_type}}

      - name: Test
        run: |
          ctest --test-dir build_${{matrix.build_type}} -j$(nproc) --output-on-failure

      - name: Generate Coverage
        if: matrix.build_type == 'Debug'
        run: |
          cd build_${{matrix.build_type}}
          rm -r Tests/
          gcovr -r .. . -s \
                --gcov-executable "$EMSDK/upstream/bin/llvm-cov gcov" \
                --cobertura coverage.xml \
                --json coverage.json

      - name: Upload Coverage to Codecov
        if: matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build_${{matrix.build_type}}/coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Archive Coverage
        if: matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-emscripten-cxx${{matrix.std}}-${{matrix.lib}}
          path: build_${{matrix.build_type}}/coverage.json
          retention-days: 1

      - name: Perform CodeQL Analysis
        if: matrix.codeql
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:cpp/emscripten
