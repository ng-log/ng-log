name: macOS

on: workflow_call

jobs:
  build-macos:
    name: AppleClang-C++${{matrix.std}}-${{matrix.build_type}}
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        std: [14, 17, 20, 23]
        include:
          - generator: Xcode
          - build_type: Debug

    steps:
      - uses: actions/checkout@v7

      - name: Setup Dependencies
        run: |
          brew install google-benchmark googletest ninja

      - name: Setup Compiler Cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos-C++${{matrix.std}}-${{matrix.build_type}}
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      # The Xcode generator ignores compiler launchers. Xcode runs the
      # compilers named by its build settings, so point these to ccache. The
      # paths are absolute because Xcode does not search the PATH of the job.
      - name: Setup Compiler Launcher
        run: |
          for compiler in clang clang++; do
            printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$(command -v ccache)" "$(xcrun -f "$compiler")" > "$RUNNER_TEMP/ccache-$compiler"
            chmod +x "$RUNNER_TEMP/ccache-$compiler"
          done

      - uses: actions/setup-python@v7
        if: matrix.build_type == 'Debug'
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/coverage/requirements.txt

      - name: Setup Coverage Dependencies
        if: matrix.build_type == 'Debug'
        run: |
          pip install -r .github/coverage/requirements.txt

      - name: Setup Environment
        if: matrix.build_type == 'Debug'
        run: |
          echo 'CXXFLAGS=--coverage' >> $GITHUB_ENV
          echo 'LDFLAGS=--coverage' >> $GITHUB_ENV

      - name: Configure
        shell: bash
        env:
          CXXFLAGS: -Wall -Wextra -Wsign-conversion -Wtautological-compare -Wformat-nonliteral -Wundef -Werror -pedantic-errors ${{env.CXXFLAGS}}
        run: |
          cmake -S . -B build_${{matrix.build_type}} \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                -DCMAKE_CXX_STANDARD=${{matrix.std}} \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_XCODE_ATTRIBUTE_CC="$RUNNER_TEMP/ccache-clang" \
                -DCMAKE_XCODE_ATTRIBUTE_CXX="$RUNNER_TEMP/ccache-clang++" \
                -DCMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO \
                -DCMAKE_XCODE_ATTRIBUTE_LD="$(xcrun -f clang)" \
                -DCMAKE_XCODE_ATTRIBUTE_LDPLUSPLUS="$(xcrun -f clang++)" \
                -G "${{matrix.generator}}" \
                -Werror=author

      - name: Build
        run: |
          cmake --build build_${{matrix.build_type}} \
                --config ${{matrix.build_type}}

      - name: Test
        run: |
          ctest --test-dir build_${{matrix.build_type}} \
                --build-config ${{matrix.build_type}} \
                --output-on-failure

      - name: Generate Coverage
        if: matrix.build_type == 'Debug'
        run: |
          cd build_${{matrix.build_type}}
          rm -r Tests/
          gcovr -r .. . -s --cobertura coverage.xml --json coverage.json

      - name: Upload Coverage to Codecov
        if: matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build_${{matrix.build_type}}/coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Archive Coverage
        if: matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-macos-cxx${{matrix.std}}
          path: build_${{matrix.build_type}}/coverage.json
          retention-days: 1
