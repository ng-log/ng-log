name: Linux

on: workflow_call

jobs:
  build-linux:
    defaults:
      run:
        shell: bash
    name: GCC-C++${{matrix.std}}-${{matrix.build_type}}-${{matrix.lib}}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ !matrix.codeql && 'ccache' || '' }}
    strategy:
      fail-fast: true
      matrix:
        build_type: [Release, Debug]
        lib: [shared, static]
        std: [14, 17, 20, 23]
        # CodeQL traces the compiler and misses translation units served from
        # the compiler cache. Analyze a single configuration without the cache.
        include:
          - build_type: Release
            lib: shared
            std: 20
            codeql: true

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: matrix.codeql
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-suggests --no-install-recommends \
            g++ \
            cmake \
            libbenchmark-dev \
            libgmock-dev \
            libgtest-dev \
            libunwind-dev \
            ninja-build

      - name: Setup Compiler Cache
        if: ${{ !matrix.codeql }}
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-C++${{matrix.std}}-${{matrix.build_type}}-${{matrix.lib}}
          evict-old-files: job
          save: ${{ github.event_name == 'push' }}

      - uses: actions/setup-python@v7
        if: matrix.build_type == 'Debug'
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: .github/coverage/requirements.txt

      - name: Setup Coverage Dependencies
        if: matrix.build_type == 'Debug'
        run: |
          pip install -r .github/coverage/requirements.txt

      - name: Setup Environment
        if: matrix.build_type == 'Debug'
        run: |
          echo 'CXXFLAGS=--coverage -fprofile-update=atomic' >> $GITHUB_ENV

      - name: Configure
        env:
          CXXFLAGS: -Wall -Wextra -Wsign-conversion -Wtautological-compare -Wformat-nonliteral -Wundef -Werror ${{env.CXXFLAGS}}
        run: |
          cmake -S . -B build_${{matrix.build_type}} \
            -DBUILD_SHARED_LIBS=${{matrix.lib == 'shared'}} \
            -DCMAKE_CXX_STANDARD=${{matrix.std}} \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install \
            -G Ninja \
            -Werror=author

      - name: Build
        run: |
          cmake --build build_${{matrix.build_type}} \
                --config ${{matrix.build_type}}

      - name: Install
        run: |
          cmake --build build_${{matrix.build_type}} \
                --config ${{matrix.build_type}} \
                --target install

          cmake build_${{matrix.build_type}} \
                -DCMAKE_INSTALL_INCLUDEDIR=foo/include \
                -DCMAKE_INSTALL_LIBDIR=foo/lib \
                -DCMAKE_INSTALL_DATAROOTDIR=foo/share
          cmake --build build_${{matrix.build_type}} \
                --config ${{matrix.build_type}} \
                --target install

      - name: Test CMake Package (relative GNUInstallDirs)
        run: |
          cmake -S src/package_config_unittest/working_config \
                -B build_${{matrix.build_type}}_package \
                -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
                -DCMAKE_PREFIX_PATH=${{github.workspace}}/install \
                -G Ninja
          cmake --build build_${{matrix.build_type}}_package \
                --config ${{matrix.build_type}}

      - name: Test CMake Package (absolute GNUInstallDirs)
        run: |
          cmake -S src/package_config_unittest/working_config \
                -B build_${{matrix.build_type}}_package_foo \
                -DCMAKE_BUILD_TYPE=${{matrix.build_type}} \
                -DCMAKE_PREFIX_PATH=${{github.workspace}}/install/foo \
                -G Ninja
          cmake --build build_${{matrix.build_type}}_package_foo \
                --config ${{matrix.build_type}}

      - name: Test
        run: |
          ctest --test-dir build_${{matrix.build_type}} -j$(nproc) --output-on-failure

      - name: Generate Coverage
        if: matrix.build_type == 'Debug'
        run: |
          cd build_${{matrix.build_type}}
          gcovr -r .. . -s --xml coverage.xml --json coverage.json

      - name: Upload Coverage to Codecov
        if: matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build_${{matrix.build_type}}/coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Archive Coverage
        if: matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-cxx${{matrix.std}}-${{matrix.lib}}
          path: build_${{matrix.build_type}}/coverage.json
          retention-days: 1

      - name: Perform CodeQL Analysis
        if: matrix.codeql
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:cpp/linux
