# Set update schedule for GitHub Actions and Python packages

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/.github/coverage"
    schedule:
      interval: "weekly"
