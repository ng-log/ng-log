exclude = src/.*_unittest\.cc
exclude = src/.*_unittest/.*
exclude = src/logging_benchmark\.cc
exclude = src/testing_utilities\.(h|cc)
exclude = src/mock-log\.h
exclude = src/subprocess_test_helper\.cc
exclude = src/addr2line_fake_.*\.cc
exclude = src/email_test_helper\.cc
exclude = src/vlog_module_test_helper\.(h|cc)
exclude = src/flags_library_copy\.cc
exclude = src/cleanup_test\.h
exclude = src/long_path_test\.h
exclude = src/fuzz_demangle\.cc
exclude-directories = Tests/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
filter = src/
# Counters summed over every test process genuinely exceed 2^32, whereas the
# gcov bug that the detection targets yields values close to 2^64.
gcov-suspicious-hits-threshold = 1099511627776
